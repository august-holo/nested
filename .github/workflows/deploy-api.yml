name: deploy api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - api/**
      - scripts/deploy-api.sh
      - .github/workflows/deploy-api.yml

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write # request the OIDC token that AWS exchanges for short-lived credentials
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Set under Settings → Secrets and variables → Actions → Variables; none are secret.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          rustup target add aarch64-unknown-linux-musl
          pipx install cargo-zigbuild==0.23.4
          pip3 install ziglang==0.14.1 # the zig compiler cargo-zigbuild cross-compiles with
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: api
      - run: cargo test --locked --release
        working-directory: api
      - run: scripts/deploy-api.sh
